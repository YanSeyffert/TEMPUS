[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempus"
version = "1.1.0"
description = "Ephemeris-driven time-coordinate integration tool"
readme = "README.md"
license = {text = "BSD-3-Clause"}
classifiers = [
  "License :: OSI Approved :: BSD License",
]
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "calcephpy>=3.5.5"
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter>=1", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
tempus = "tempus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]